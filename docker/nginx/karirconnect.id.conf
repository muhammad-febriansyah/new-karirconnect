# Host Nginx in front of the KarirConnect containers (behind-proxy mode).
# Copy to /etc/nginx/sites-available/karirconnect.id, keep the certificate
# paths certbot already wrote, then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name karirconnect.id www.karirconnect.id;
    return 301 https://karirconnect.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.karirconnect.id;

    ssl_certificate     /etc/letsencrypt/live/karirconnect.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karirconnect.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://karirconnect.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name karirconnect.id;

    ssl_certificate     /etc/letsencrypt/live/karirconnect.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karirconnect.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # CV and image uploads; PHP limits are set in docker/php/php.ini.
    client_max_body_size 25m;

    # Security headers come from Caddy and Laravel; do not add them here too,
    # duplicated headers lower the securityheaders.com grade.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Visitor IP: Cloudflare's header when the request came through it.
        proxy_set_header X-Real-IP $karirconnect_client_ip;
        proxy_set_header X-Forwarded-For $karirconnect_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_karirconnect;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}

# The site sits behind Cloudflare: nginx only sees Cloudflare's address, so the
# visitor IP comes from CF-Connecting-IP (falls back to the peer address).
# Laravel's rate limits and logs rely on it.
map $http_cf_connecting_ip $karirconnect_client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

# WebSocket upgrade only when the client asks for it.
map $http_upgrade $connection_upgrade_karirconnect {
    default upgrade;
    ''      '';
}
